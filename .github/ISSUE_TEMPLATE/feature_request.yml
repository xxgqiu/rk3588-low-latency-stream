name: 功能建议
description: 提议一个符合项目边界的新能力或改进
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 请先描述真实使用场景，而不只是指定实现方案。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: tradeoffs
    attributes:
      label: 实时性、资源和兼容性影响
      description: 说明可能影响的队列、ownership、CPU/RSS、延迟或硬件依赖。
